[build]
target = "x86_64-unknown-none"
incremental = true
# The regular page size for this target; see `paging::structs::sizes::Regular`.
# Belongs with the target, because it describes the machine, not the code.
rustflags = ["--cfg", 'target_min_page="4kib"']
# rustdoc does not inherit the flags above, and doctests need the same cfg.
rustdocflags = ["--cfg", 'target_min_page="4kib"']

[env]
RUSTC_BOOTSTRAP = { value = "1", force = true }
CARGO_UNSTABLE_JSON_TARGET_SPEC = { value = "true", force = true }
CARGO_UNSTABLE_UNSTABLE_OPTIONS = { value = "true", force = true }

[profile.dev]
incremental = true
debug-assertions = true

[profile.release]
incremental = true
debug-assertions = false

[alias]
verify = "v build"