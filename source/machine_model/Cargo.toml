[package]
name = "machine_model"
version = "0.1.0"
edition = "2021"

[dependencies]
vstd = { workspace = true, default-features = false, features = ["alloc"] }
bitflags = { workspace = true }
bitflags_verus = { path = "../bitflags_verus" }
paste = { workspace = true }

[features]
verification-test = []
reject-send = []
reject-sync = []

[package.metadata.verus]
verify = true

[lints.rust]
# Verus sets `verus_only` during verification and `verus_keep_ghost` itself;
# declaring them keeps a plain `cargo build` warning-free.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(verus_only)',
    'cfg(verus_keep_ghost)',
    'cfg(verus_keep_ghost_body)',
] }
