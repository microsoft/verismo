[package]
name = "verios-pagetable-beta"
version = "0.1.0"
edition = "2021"

[lib]
name = "paging"

[dependencies]
bitflags = { workspace = true }
# Verus deps: the specs and proofs are ghost, and a plain build erases them.
vstd = { workspace = true, default-features = false }
builtin_macros = { workspace = true }
verus_state_machines_macros = { workspace = true }

[dev-dependencies]
pgtable = { git = "https://github.com/MSRSSP/verios-pagetable", rev = "b21b173cffbc9eae176dd8135f8b28121bd2d48c" }
x86_64 = { version = "=0.15.2", default-features = false }

[[bench]]
name = "paging_compare"
harness = false
required-features = ["concurrent"]

[features]
default = ["concurrent"]
ignore_access_dirty_bits = []
concurrent = []
verification-test = []

[package.metadata.verus]
verify = true

[lints.rust]
# Verus sets these itself; declaring them keeps a plain `cargo build`
# warning-free.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(verus_only)',
    'cfg(verus_keep_ghost)',
    'cfg(verus_keep_ghost_body)',
    # The smallest page this build maps; see `structs::sizes::MinPageSize`.
    'cfg(target_min_page, values("4kib", "2mib", "1gib"))',
] }
