[package]
name = "paging"
version = "0.1.0"
edition = "2021"

[dependencies]
bitflags = { workspace = true }

[features]
verification-test = []

[package.metadata.verus]
verify = false

[lints.rust]
# Verus sets these itself; declaring them keeps a plain `cargo build`
# warning-free.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(verus_only)',
    'cfg(verus_keep_ghost)',
    'cfg(verus_keep_ghost_body)',
    # The smallest page this build maps; see `structs::sizes::MinPageSize`.
    'cfg(target_min_page, values("4kib", "2mib", "1gib"))',
] }
