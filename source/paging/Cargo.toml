[package]
name = "verios-pagetable-beta"
version = "0.1.0"
edition = "2021"

[lib]
name = "paging"

[dependencies]
bitflags = { workspace = true }
machine_model = { path = "../machine_model" }
spin = { version = "0.12.3", default-features = false, features = ["mutex", "ticket_mutex", "spin_mutex"] }
# Verus deps: the specs and proofs are ghost, and a plain build erases them.
vstd = { workspace = true, default-features = false }
verus_builtin_macros = { workspace = true }
verus_state_machines_macros = { workspace = true }

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
x86_64 = { version = "=0.15.2", default-features = false }

[[example]]
name = "kvm-guest"
path = "tests/kvm/guest.rs"
required-features = ["kvm-test"]

[[example]]
name = "kvm-smp-guest"
path = "tests/kvm/smp_guest.rs"
required-features = ["kvm-smp-test"]

[features]
spin-mutex = []
striped-locks = []
lock-wait-hook = []
ignore_access_dirty_bits = []
kvm-test = []
kvm-smp-test = []
verification-test = []

[package.metadata.verus]
verify = true

[lints.rust]
# Verus sets these itself; declaring them keeps a plain `cargo build`
# warning-free.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(verus_only)',
    'cfg(verus_keep_ghost)',
    'cfg(verus_keep_ghost_body)',
    # The regular page size for this target; see `structs::sizes::Regular`.
    'cfg(target_min_page, values("4kib", "2mib", "1gib"))',
] }
