[package]
name = "paging"
version = "0.1.0"
edition = "2021"

[dependencies]
# Verus deps
vstd = { workspace = true, features = ["alloc"], default-features = false }
verus_state_machines_macros = { workspace = true }
machine_model = { path = "../machine_model" }
bitflags = { workspace = true }
bitflags_verus = { path = "../bitflags_verus" }
zerocopy = { workspace = true }
builtin_macros = { workspace = true }
common_proofs = { path = "../common_proofs" }
concurrent_rw = { path = "../concurrent_rw" }

[features]
verification-test = []

[package.metadata.verus]
verify = true

[lints.rust]
# Verus turns on `--cfg verus_only` during verification and sets
# `verus_keep_ghost` itself; declaring both keeps a plain `cargo build`
# warning-free.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(verus_only)',
    'cfg(verus_keep_ghost)',
    'cfg(verus_keep_ghost_body)',
    # The smallest page this build maps; see `structs::sizes::MinPageSize`.
    'cfg(target_min_page, values("4kib", "2mib", "1gib"))',
] }
