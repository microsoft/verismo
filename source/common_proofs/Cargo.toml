[package]
name = "common_proofs"
version = "0.1.0"
edition = "2021"

[dependencies]
vstd = { workspace = true, features = ["alloc"], default-features = false }
builtin_macros = { workspace = true }
seq-macro = "0.3"

[package.metadata.verus]
verify = true

[lints.rust]
# Verus turns on `--cfg verus_only` during verification and sets
# `verus_keep_ghost` itself; declaring both keeps a plain `cargo build`
# warning-free.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)', 'cfg(verus_keep_ghost)', 'cfg(verus_keep_ghost_body)'] }
